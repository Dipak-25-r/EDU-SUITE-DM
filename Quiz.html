  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replace with your Firebase configuration object
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyAtDRRnUE3FM06gPrs9mHWXJnU9fXv5B54",
      authDomain: "edu-suite-a55a5.firebaseapp.com",
      projectId: "edu-suite-a55a5",

      messagingSenderId: "5059668896",
      appId: "1:5059668896:web:76fc4c09c1d298ca8012c5",
      measurementId: "G-8G4448P207"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function trackPageView(pageName) {
      // Document reference in the 'analytics' collection
      const pageRef = doc(db, "analytics", pageName);

      try {
        // Increment totalViews by 1 safely
        await setDoc(pageRef, {
          totalViews: increment(1),
          lastVisited: new Date()
        }, { merge: true });

        console.log(`Page view tracked for: ${pageName}`);
      } catch (error) {
        console.error("Error tracking analytics: ", error);
      }
    }

    // Automatically track on page load
    const currentPage = window.location.pathname.replace(/\//g, "_") || "home";
    trackPageView(currentPage);
  </script>


  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#58CC02', accent: '#2b70fa' } } }
    }
  </script>

  <!-- KaTeX for Mathematics Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"

  <style>

</head>

<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5MXP3RTV" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- ================= ADMIN / TEACHER DASHBOARD ================= -->
  <section id="admin" class="hidden p-8 max-w-5xl mx-auto w-full">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-extrabold text-primary">📊 Live Test Analytics</h2>
      <button onclick="exportCSV()"
        class="bg-accent px-4 py-2 rounded-xl font-bold text-white hover:opacity-90 shadow">Export CSV</button>
    </div>
    <div class="overflow-x-auto bg-gray-800 rounded-2xl shadow-xl border border-gray-700">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-700 text-gray-300 uppercase text-xs tracking-wider">
          <tr>
            <th class="p-4">Student Name</th>
            <th class="p-4">Roll No</th>
            <th class="p-4">Score</th>
            <th class="p-4">Percentage</th>
            <th class="p-4">Status</th>
          </tr>
        </thead>
        <tbody id="liveTable" class="divide-y divide-gray-700 text-sm"></tbody>
      </table>
    </div>
  </section>

  <!-- ================= TEACHER / QUIZ BUILDER ================= -->
  <section id="teacher" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-xl fade border border-gray-700">
      <h1 class="text-3xl font-black mb-6 text-center text-primary">Advanced Quiz Builder</h1>

      <div class="grid grid-cols-2 gap-3 mb-4">
        <input id="quizTitle" placeholder="Quiz Title (e.g. Calculus Test)"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
        <input id="timePerQ" type="number" placeholder="Secs per Question"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
      </div>

      <textarea id="questionText" placeholder="Question Text (supports LaTeX like $\int x^2 dx$)"
        class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg mb-3 focus:border-primary outline-none h-24"></textarea>

      <div class="space-y-2 mb-4">
        <input id="o0" placeholder="Option A"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
        <input id="o1" placeholder="Option B"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
        <input id="o2" placeholder="Option C"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
        <input id="o3" placeholder="Option D"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
      </div>

      <div class="flex gap-3 mb-4">
        <select id="ans"
          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg focus:border-primary outline-none">
          <option value="0">Correct: Option A</option>
          <option value="1">Correct: Option B</option>
          <option value="2">Correct: Option C</option>
          <option value="3">Correct: Option D</option>
        </select>
        <button onclick="addQuestion()"
          class="bg-gray-700 px-6 py-3 font-bold rounded-lg hover:bg-gray-600 transition whitespace-nowrap">+
          Add</button>
      </div>

      <div id="questionCounter" class="text-xs text-gray-400 mb-4 text-center">Questions added: 0</div>

      <button onclick="publishQuiz()"
        class="w-full bg-primary text-black py-3 font-extrabold rounded-xl hover:opacity-95 transition shadow-lg">
        🚀 Publish & Generate Link
      </button>

      <div id="quizLink"
        class="text-center text-sm mt-4 text-primary font-mono bg-gray-900 p-3 rounded-lg hidden border border-gray-700">
      </div>
    </div>
  </section>

  <!-- ================= STUDENT ENTRY ================= -->
  <section id="studentInfo" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md fade border border-gray-700">
      <h2 class="text-2xl font-black mb-2 text-center text-primary">Ready to Test?</h2>
      <p class="text-gray-400 text-sm text-center mb-6">Enter your details to begin your exam session.</p>
      <input id="studentName" placeholder="Full Name"
        class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg mb-3 focus:border-primary outline-none">
      <input id="studentRoll" placeholder="Roll Number / ID"
        class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg mb-5 focus:border-primary outline-none">

      <button onclick="startQuizSession()"
        class="w-full bg-primary text-black py-3 font-extrabold rounded-xl hover:opacity-95 transition shadow-lg">
        Start Test Now 🎯
      </button>
    </div>
  </section>

  <!-- ================= QUIZ INTERFACE ================= -->
  <section id="quizSection" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg fade border border-gray-700">

      <div class="flex justify-between text-sm font-bold text-gray-400 mb-3">
        <span id="timer" class="bg-gray-900 px-3 py-1 rounded-full border border-gray-700">⏱ 00s</span>
        <span id="qno" class="bg-gray-900 px-3 py-1 rounded-full border border-gray-700">Q 1/1</span>
      </div>

      <div class="bg-gray-900 h-2.5 rounded-full mb-6 overflow-hidden border border-gray-700">
        <div id="bar" class="bg-primary h-full rounded-full progress" style="width: 0%"></div>
      </div>

      <h2 id="question" class="text-xl font-bold mb-6 leading-relaxed"></h2>
      <div id="options" class="space-y-3"></div>

    </div>
  </section>

  <!-- ================= RESULT CARD ================= -->
  <section id="result" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl text-center fade max-w-md w-full border border-gray-700">
      <div class="text-5xl mb-3">🏆</div>
      <h2 class="text-3xl font-black text-primary mb-2">Test Completed!</h2>
      <p id="scoreText" class="text-lg text-gray-300 mb-6"></p>
      <div id="resultButtons" class="space-y-3"></div>
    </div>
  </section>

  <!-- ================= LEADERBOARD SECTION ================= -->
  <section id="leaderboardSection"
    class="hidden min-h-screen p-6 max-w-2xl mx-auto w-full flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 w-full fade">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-3xl font-black text-primary">🏆 Class Leaderboard</h2>
        <button onclick="backToHome()"
          class="bg-gray-700 text-sm px-4 py-2 rounded-xl font-bold hover:bg-gray-600 transition">Home</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-gray-700 text-gray-400 text-xs uppercase tracking-wider">
              <th class="p-3">Rank</th>
              <th class="p-3">Student Name</th>
              <th class="p-3">Roll No</th>
              <th class="p-3 text-right">Score</th>
            </tr>
          </thead>
          <tbody id="leaderboardList" class="divide-y divide-gray-700/50 text-sm"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ================= APP LOGIC & FIREBASE ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrK20CbFxWH2V6iS8EPfXSAjD2RDvxKQo",
      authDomain: "online-quiz-f51dc.firebaseapp.com",
      projectId: "online-quiz-f51dc",
      storageBucket: "online-quiz-f51dc.firebasestorage.app",
      messagingSenderId: "676955998340",
      appId: "1:676955998340:web:e22fd3fb6ec49549de9ad1",
      measurementId: "G-9J6WK672J6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let quiz = { title: '', questions: [], time: 15 };
    let index = 0, score = 0, timerInt, cheated = false;
    let user = {};

    const params = new URLSearchParams(location.search);
    const quizCode = params.get("code");

    // Web Audio Feedback
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'correct') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        } else {
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.15);
        }
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) { }
    };

    // Admin route handling
    if (location.hash === "#admin") {
      admin.classList.remove("hidden");
      teacher.classList.add("hidden");
      studentInfo.classList.add("hidden");

      onSnapshot(collection(db, "results"), snap => {
        liveTable.innerHTML = "";
        snap.forEach(d => {
          const r = d.data();
          const pct = Math.round((r.score / r.total) * 100);
          liveTable.innerHTML += `
      <tr class="hover:bg-gray-700/50 transition">
        <td class="p-4 font-semibold">${r.name}</td>
        <td class="p-4 text-gray-400">${r.roll}</td>
        <td class="p-4 font-bold text-primary">${r.score}/${r.total}</td>
        <td class="p-4">${pct}%</td>
        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${r.status === 'OK' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${r.status}</span></td>
      </tr>`;
        });
      });
    }

    if (quizCode) {
      teacher.classList.add("hidden");
      studentInfo.classList.remove("hidden");
    }

    window.addQuestion = () => {
      if (!questionText.value || !o0.value || !o1.value || !o2.value || !o3.value)
        return alert("Please fill out all question and option fields.");

      quiz.title = quizTitle.value || "Math Assessment";
      quiz.time = +timePerQ.value || 15;
      quiz.questions.push({
        q: questionText.value,
        o: [o0.value, o1.value, o2.value, o3.value],
        a: +ans.value
      });

      questionCounter.innerText = `Questions added: ${quiz.questions.length}`;
      questionText.value = o0.value = o1.value = o2.value = o3.value = "";
    };

    window.publishQuiz = async () => {
      if (!quiz.questions.length) return alert("Please add at least one question!");
      const code = Math.random().toString(36).substring(2, 8);
      await setDoc(doc(db, "quizzes", code), quiz);
      quizLink.classList.remove("hidden");
      quizLink.innerHTML = `Shareable Link:<br><a href="${location.origin + location.pathname}?code=${code}" target="_blank" class="underline text-accent">${location.origin + location.pathname}?code=${code}</a>`;
    };

    window.startQuizSession = async () => {
      if (!studentName.value || !studentRoll.value) return alert("Please enter your Name and Roll Number.");
      user = { name: studentName.value, roll: studentRoll.value };

      const snap = await getDoc(doc(db, "quizzes", quizCode));
      if (!snap.exists()) return alert("Quiz not found or invalid link.");
      quiz = snap.data();

      studentInfo.classList.add("hidden");
      quizSection.classList.remove("hidden");
      loadQ();
    };

    // Anti-Cheat
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && !quizSection.classList.contains("hidden")) {
        cheated = true;
        finishQuiz();
      }
    });

    function loadQ() {
      const q = quiz.questions[index];
      let t = quiz.time;
      timer.innerText = `⏱ ${t}s`;
      qno.innerText = `Q ${index + 1}/${quiz.questions.length}`;
      bar.style.width = ((index + 1) / quiz.questions.length) * 100 + "%";
      question.innerHTML = q.q;

      options.innerHTML = "";
      clearInterval(timerInt);

      timerInt = setInterval(() => {
        t--;
        timer.innerText = `⏱ ${t}s`;
        if (t <= 0) { clearInterval(timerInt); submitAnswer(-1); }
      }, 1000);

      q.o.forEach((op, i) => {
        let b = document.createElement("button");
        b.className = "w-full p-3 bg-gray-900 border border-gray-700 rounded-xl hover:bg-primary hover:text-black font-medium text-left transition shadow";
        b.innerHTML = op;
        b.onclick = () => submitAnswer(i);
        options.appendChild(b);
      });

      if (window.renderMathInElement) {
        renderMathInElement(document.body);
      }
    }

    function submitAnswer(selectedIdx) {
      clearInterval(timerInt);
      if (selectedIdx === quiz.questions[index].a) {
        score++;
        playSound('correct');
      } else {
        playSound('wrong');
      }
      index++;
      index < quiz.questions.length ? loadQ() : finishQuiz();
    }

    async function finishQuiz() {
      quizSection.classList.add("hidden");
      result.classList.remove("hidden");
      scoreText.innerText = `${user.name}, you scored ${score} out of ${quiz.questions.length} (${Math.round((score / quiz.questions.length) * 100)}%)`;

      await addDoc(collection(db, "results"), {
        quizCode,
        ...user,
        score,
        total: quiz.questions.length,
        status: cheated ? "CHEATED" : "OK",
        timestamp: Date.now()
      });

      const btnContainer = document.getElementById('resultButtons');
      btnContainer.innerHTML = `
    <button onclick="showLeaderboard('${quizCode}')" class="bg-accent text-white font-extrabold px-6 py-3 rounded-xl w-full shadow-lg hover:opacity-90 transition">📊 View Class Leaderboard</button>
    <button onclick="location.reload()" class="bg-gray-700 text-gray-200 font-bold px-6 py-3 rounded-xl w-full hover:bg-gray-600 transition">Back to Home</button>
  `;
    }

    window.showLeaderboard = async (code) => {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('leaderboardSection').classList.remove('hidden');

      const lbList = document.getElementById('leaderboardList');
      lbList.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Loading rankings...</td></tr>`;

      try {
        const resultsRef = collection(db, "results");
        const q = query(resultsRef, orderBy("score", "desc"), limit(10));

        onSnapshot(q, (snapshot) => {
          lbList.innerHTML = "";
          let rank = 1;

          if (snapshot.empty) {
            lbList.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">No scores recorded yet.</td></tr>`;
            return;
          }

          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            let badgeColor = "text-gray-300";
            if (rank === 1) badgeColor = "text-yellow-400 font-extrabold";
            else if (rank === 2) badgeColor = "text-gray-300 font-bold";
            else if (rank === 3) badgeColor = "text-amber-600 font-bold";

            lbList.innerHTML += `
          <tr class="hover:bg-gray-700/30 transition">
            <td class="p-3 ${badgeColor}">#${rank}</td>
            <td class="p-3 font-semibold text-white">${data.name}</td>
            <td class="p-3 text-gray-400">${data.roll}</td>
            <td class="p-3 text-right font-bold text-primary">${data.score}/${data.total}</td>
          </tr>
        `;
            rank++;
          });
        });
      } catch (error) {
        lbList.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-400">Failed to load leaderboard.</td></tr>`;
      }
    };

    window.backToHome = () => {
      document.getElementById('leaderboardSection').classList.add('hidden');
      location.reload();
    };

    window.exportCSV = () => {
      let csv = "Name,Roll,Score,Total,Status\n";
      liveTable.querySelectorAll("tr").forEach(tr => {
        const cols = tr.querySelectorAll("td");
        if (cols.length) {
          csv += `${cols[0].innerText},${cols[1].innerText},${cols[2].innerText},${cols[3].innerText},${cols[4].innerText}\n`;
        }
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'quiz_results.csv';
      a.click();
    };
  </script>

  <script src="assets/global-navbar.js" defer></script>
</body>

</html>
