          <div class="space-y-2 text-xs sm:text-sm">
            <div class="p-2 bg-slate-800 rounded-lg border border-slate-700">
              <p class="font-bold text-amber-300">1️⃣ પ્રથમ વિકલીત કસોટી ($f'(x)$):</p>
              <p class="text-xs mt-0.5">• $+$ થી $-\\implies$ <strong>સ્થાનીય મહત્તમ</strong></p>
              <p class="text-xs">• $-$ થી $+\\implies$ <strong>સ્થાનીય ન્યૂનતમ</strong></p>
              <p class="text-xs text-slate-400">• નિશાની ન બદલાય $\\implies$ <strong>નતિબિંદુ</strong></p>
            </div>
            <div class="p-2 bg-violet-950/60 rounded-xl border border-violet-500/30">
              <p class="font-bold text-violet-300">2️⃣ દ્વિતીય વિકલીત કસોટી ($f''(c)$):</p>
              <p class="text-xs font-mono text-emerald-300">• $f''(c) < 0 \\implies$ સ્થાનીય મહત્તમ</p>
              <p class="text-xs font-mono text-rose-300">• $f''(c) > 0 \\implies$ સ્થાનીય ન્યૂનતમ</p>
              <p class="text-xs font-mono text-amber-300">• $f''(c) = 0 \\implies$ કસોટી નિષ્ફળ (પ્રથમ કસોટી વાપરો)</p>
            </div>
          </div>
        `,
        graphSvg: `
          <svg viewBox="0 0 200 90" class="w-full h-24 my-1 bg-slate-950/60 rounded-xl p-2 border border-violet-500/30">
            <!-- Curve with Max and Min -->
            <path d="M 10 70 C 40 10, 70 10, 100 50 C 130 90, 160 90, 190 30" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
            <!-- Max Point -->
            <circle cx="55" cy="22" r="4" fill="#ef4444"/>
            <text x="55" y="12" fill="#fca5a5" font-size="8" text-anchor="middle" font-weight="bold">મહત્તમ f''(c)<0</text>
            <!-- Min Point -->
            <circle cx="145" cy="78" r="4" fill="#10b981"/>
            <text x="145" y="88" fill="#6ee7b7" font-size="8" text-anchor="middle" font-weight="bold">ન્યૂનતમ f''(c)>0</text>
            <!-- Tangent line at max -->
            <line x1="30" y1="22" x2="80" y2="22" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2"/>
          </svg>
        `
      }
    ];

    // App State
    let filteredCards = [...cardsData];
    let currentViewMode = 'grid'; // 'grid' or 'slide'
    let currentSlideIndex = 0;
    let activeChapterFilter = 'all';

    // Initialize Page
    document.addEventListener("DOMContentLoaded", () => {
      renderCards();
    });

    // Filter Chapter
    function filterChapter(ch) {
      activeChapterFilter = ch;
      // Update Tab Styles
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/30');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });
      const activeTab = document.getElementById(`tab-${ch}`);
      if (activeTab) {
        activeTab.classList.remove('bg-slate-800', 'text-slate-300');
        activeTab.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/30');
      }

      applyFilters();
    }

    // Handle Search
    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      filteredCards = cardsData.filter(card => {
        const matchesChapter = activeChapterFilter === 'all' || card.chapter == activeChapterFilter;
        const matchesQuery = !query || 
          card.chapterName.toLowerCase().includes(query) ||
          card.topic.toLowerCase().includes(query) ||
          card.frontText.toLowerCase().includes(query) ||
          card.detailsText.toLowerCase().includes(query);

        return matchesChapter && matchesQuery;
      });

      currentSlideIndex = 0;
      renderCards();
    }

    // Switch View Mode
    function setViewMode(mode) {
      currentViewMode = mode;
      const gridBtn = document.getElementById('gridModeBtn');
      const slideBtn = document.getElementById('slideModeBtn');
      const gridView = document.getElementById('gridView');
      const slideView = document.getElementById('slideView');

      if (mode === 'grid') {
        gridBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-indigo-600 text-white shadow-md";
        slideBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-slate-400 hover:text-white transition-all";
        gridView.classList.remove('hidden');
        slideView.classList.add('hidden');
        slideView.classList.remove('flex');
      } else {
        slideBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-indigo-600 text-white shadow-md";
        gridBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-slate-400 hover:text-white transition-all";
        gridView.classList.add('hidden');
        slideView.classList.remove('hidden');
        slideView.classList.add('flex');
        renderSlide();
      }
    }

    // Render Cards in Grid or Slide Mode
    function renderCards() {
      if (currentViewMode === 'grid') {
        renderGrid();
      } else {
        renderSlide();
      }
      // Re-trigger MathJax typesetting
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    // Render Grid View
    function renderGrid() {
      const container = document.getElementById('gridView');
      if (filteredCards.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-50"></i>
            <p class="text-base font-semibold">કોઈ ફ્લેશકાર્ડ મળ્યું નથી.</p>
            <p class="text-xs mt-1">કૃપા કરીને અન્ય શબ્દ સર્ચ કરો અથવા ફિલ્ટર બદલો.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredCards.map(card => `
        <div class="perspective-1000 h-[430px] w-full cursor-pointer group" onclick="toggleCardFlip(this)">
          <div class="card-inner relative w-full h-full transform-style-3d transition-transform duration-700 rounded-2xl shadow-xl hover:shadow-2xl">
            
            <!-- FRONT SIDE -->
            <div class="absolute inset-0 backface-hidden rounded-2xl p-5 flex flex-col justify-between border border-white/10 bg-gradient-to-br ${card.colorTheme} text-white">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${card.badgeColor} border">
                    ${card.chapterName.split(':')[0]}
                  </span>
                  <span class="text-2xl">${card.frontEmoji}</span>
                </div>
                <h3 class="text-lg font-bold leading-snug text-amber-300 mb-1">${card.topic}</h3>
                <p class="text-sm text-slate-200 mt-2 font-medium">${card.frontText}</p>
              </div>

              ${card.graphSvg || ''}

              <div class="pt-3 border-t border-white/10 flex items-center justify-between text-xs text-slate-300 font-semibold">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-hand-pointer text-amber-400 animate-bounce"></i> ક્લીક કરીને જવાબ જુઓ</span>
                <span class="text-indigo-300">Flip 🔄</span>
              </div>
            </div>

            <!-- BACK SIDE -->
            <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-2xl p-5 flex flex-col justify-between border border-indigo-500/30 bg-slate-900 text-slate-100">
              <div>
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
                  <span class="text-xs font-bold text-indigo-400">${card.topic}</span>
                  <span class="text-xs text-slate-400">ઉકેલ / વિગતો</span>
                </div>
                <div class="mt-1">
                  ${card.detailsText}
                </div>
              </div>

              <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400 font-medium">
                <span>Kumar Success Notes</span>
                <span class="text-indigo-400 font-bold">પાછા ફરો 🔄</span>
              </div>
            </div>

          </div>
        </div>
      `).join('');
    }

    // Render Slide View
    function renderSlide() {
      if (filteredCards.length === 0) return;
      if (currentSlideIndex >= filteredCards.length) currentSlideIndex = 0;
      if (currentSlideIndex < 0) currentSlideIndex = filteredCards.length - 1;

      const card = filteredCards[currentSlideIndex];
      const activeCard = document.getElementById('activeSlideCard');
      activeCard.classList.remove('rotate-y-180'); // reset flip

      document.getElementById('slideCounter').innerText = `કાર્ડ ${currentSlideIndex + 1} / ${filteredCards.length}`;
      document.getElementById('slideChapterBadge').innerText = card.chapterName.split(':')[0];
      
      const pct = ((currentSlideIndex + 1) / filteredCards.length) * 100;
      document.getElementById('progressBar').style.width = `${pct}%`;

      // Front
      document.getElementById('slideFront').className = `absolute inset-0 backface-hidden rounded-3xl p-6 sm:p-8 flex flex-col justify-between border border-white/20 shadow-2xl bg-gradient-to-br ${card.colorTheme} text-white`;
      document.getElementById('slideFront').innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-4">
            <span class="px-3 py-1 rounded-full text-xs font-bold ${card.badgeColor} border">
              ${card.chapterName}
            </span>
            <span class="text-4xl">${card.frontEmoji}</span>
          </div>
          <h2 class="text-xl sm:text-2xl font-black text-amber-300 mb-2">${card.topic}</h2>
          <p class="text-base sm:text-lg text-slate-100 font-medium leading-relaxed mt-3">${card.frontText}</p>
        </div>

        ${card.graphSvg || ''}

        <div class="pt-4 border-t border-white/20 flex items-center justify-between text-xs text-slate-200">
          <span>💡 ફ્લેશકાર્ડ પર ક્લીક કરો અથવા નીચે બટન વાપરો</span>
          <span class="font-bold text-amber-300">ફ્લિપ કરો 🔄</span>
        </div>
      `;

      // Back
      document.getElementById('slideBack').innerHTML = `
        <div>
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700">
            <span class="text-xs font-bold text-indigo-300">${card.chapterName}</span>
            <span class="text-xs font-bold text-amber-400">વ્યાખ્યા / સૂત્રો</span>
          </div>
          <div>
            ${card.detailsText}
          </div>
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
          <span>Revision Flashcards</span>
          <span class="text-indigo-400 font-bold">મુખ્ય પૃષ્ઠ 🔄</span>
        </div>
      `;

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    // Slide Next/Prev
    function nextSlide() {
      if (filteredCards.length === 0) return;
      currentSlideIndex = (currentSlideIndex + 1) % filteredCards.length;
      renderSlide();
    }

    function prevSlide() {
      if (filteredCards.length === 0) return;
      currentSlideIndex = (currentSlideIndex - 1 + filteredCards.length) % filteredCards.length;
      renderSlide();
    }

    // Toggle Flip Effect
    function toggleCardFlip(element) {
      const inner = element.querySelector('.card-inner') || document.getElementById('activeSlideCard');
      if (inner) {
        inner.classList.toggle('rotate-y-180');
      }
    }

    function toggleActiveFlip() {
      const activeCard = document.getElementById('activeSlideCard');
      if (activeCard) {
        activeCard.classList.toggle('rotate-y-180');
      }
    }
  </script>
<script src="assets/global-navbar.js" defer></script>
</body>
</html>
